---
- name: Instalar Samba
  community.general.zypper:
    name: samba
    state: present
  tags: [samba, packages]

- name: Crear usuario del sistema para Samba
  ansible.builtin.user:
    name: "{{ samba_system_user }}"
    shell: /sbin/nologin
    create_home: no
    state: present
  tags: [samba]

- name: Crear directorio compartido
  ansible.builtin.file:
    path: "{{ samba_share_path }}"
    state: directory
    owner: "{{ samba_system_user }}"
    group: users
    mode: "{{ samba_directory_mask }}"
    setype: samba_share_t
  tags: [samba]

- name: Agregar recurso Samba sin borrar los existentes
  ansible.builtin.blockinfile:
    path: /etc/samba/smb.conf
    marker: "# {mark} ANSIBLE SHARE {{ samba_share_name }}"
    block: |
      [{{ samba_share_name }}]
         comment = Recurso compartido desplegado con Ansible
         path = {{ samba_share_path }}
         read only = no
         browseable = yes
         valid users = {{ samba_system_user }}
         create mask = {{ samba_create_mask }}
         directory mask = {{ samba_directory_mask }}
    backup: yes
    validate: "testparm -s %s"
  notify: Recargar Samba
  tags: [samba]

- name: Comprobar si el usuario ya existe en Samba
  ansible.builtin.shell: "set -o pipefail; pdbedit -L | cut -d: -f1 | grep -qx '{{ samba_system_user }}'"
  args:
    executable: /bin/bash
  register: samba_user_check
  changed_when: false
  failed_when: false
  tags: [samba]

- name: Crear usuario de Samba
  ansible.builtin.command: "smbpasswd -a -s {{ samba_system_user }}"
  args:
    stdin: "{{ samba_user_password }}\n{{ samba_user_password }}"
  when: samba_user_check.rc != 0
  no_log: true
  tags: [samba]

- name: Habilitar e iniciar servicios de Samba
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: yes
    state: started
  loop: "{{ samba_services }}"
  tags: [samba]

- name: Permitir Samba desde redes autorizadas
  ansible.posix.firewalld:
    zone: public
    rich_rule: 'rule family="ipv4" source address="{{ item }}" service name="samba" accept'
    permanent: true
    immediate: true
    state: enabled
  loop:
    - 192.168.6.0/24
    - 192.168.1.0/24
  tags: [samba]

- name: Deshabilitar Samba global
  ansible.posix.firewalld:
    zone: public
    service: samba
    permanent: true
    immediate: true
    state: disabled
  tags: [samba]
